stages:
  - lint
  - publish

# Every job runs on Obachan's own runner. GitLab's shared runners are out of
# quota on this project, so an untagged job does not queue -- it fails outright
# with `ci_quota_exceeded` before it starts. Setting this as a default rather
# than per-job means a future job cannot silently inherit that failure: `lint`
# was the only untagged job here, so the one gate that ran on every change was
# the one that could not run at all.
#
# `obachan-staging-oss` is the isolated runner for public projects: tagged-only
# and ref_protected, so an outside contributor's branch cannot execute on our
# cluster.
default:
  tags:
    - obachan-staging-oss

# Branch pipelines only, and only on protected refs.
#
# GitLab never marks a detached merge-request ref as protected, so a
# ref_protected runner can never acquire an MR pipeline -- the job queues
# forever. Running on the branch gives the same pre-merge signal on a ref the
# runner accepts. Maintainer branch prefixes and `v*` tags are protected for
# exactly this reason; an outside contributor's branch stays unprotected, gets
# no pipeline, and never executes on our cluster.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_REF_PROTECTED == "true"
    - when: never

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  paths:
    - .cache/pip

lint:
  stage: lint
  image: python:3.13-slim
  script:
    - pip install "ruff==0.16.5"
    - ruff check .
  # No rules: the workflow above already restricts this to protected refs and
  # tags. The previous list gated lint on merge requests, which no longer
  # produce pipelines here.

publish:
  stage: publish
  image: python:3.13-slim
  script:
    - pip install hatch twine
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        # Tagged release -- use version from pyproject.toml as-is
        hatch build
      else
        # Branch push -- PEP 440 dev version: X.Y.Z.dev<pipeline_id>
        BASE_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
        sed -i "s/^version = \".*\"/version = \"${BASE_VERSION}.dev${CI_PIPELINE_IID}\"/" pyproject.toml
        hatch build
      fi

    # Publish to GitLab package registry. GitLab's PyPI endpoint does not
    # support twine --skip-existing, so allow duplicate tag retries to continue
    # to the PyPI publish step.
    - |
      if ! TWINE_PASSWORD=${CI_JOB_TOKEN} TWINE_USERNAME=gitlab-ci-token twine upload --repository-url ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/pypi dist/*; then
        if [ -n "$CI_COMMIT_TAG" ]; then
          echo "WARNING: GitLab package upload failed; continuing for tag retry (package may already exist)." >&2
        else
          exit 1
        fi
      fi

    # Publish to PyPI (tagged releases only). Tagged release pipelines must
    # have PYPI_API_TOKEN configured; otherwise downstream projects cannot
    # install granny-devops from pypi.org.
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        if [ -z "$PYPI_API_TOKEN" ]; then
          echo "ERROR: PYPI_API_TOKEN is required for tagged releases so granny-devops is published to pypi.org." >&2
          exit 1
        fi
        TWINE_PASSWORD=${PYPI_API_TOKEN} TWINE_USERNAME=__token__ twine upload --verbose --skip-existing dist/*
      fi
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
