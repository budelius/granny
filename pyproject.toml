[project]
name = "granny-devops"
version = "0.4.0"
description = "Cloud tools collection -- AWS infrastructure, CDN, and DevOps automation"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Martin Wieser", email = "martin.wieser@pseekoo.com" }]
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.38",
    "click>=8.1",
    "python-dotenv>=1.1.0",
    "requests>=2.32",
]

[project.optional-dependencies]
# Development and release tooling
dev = [
    "hatch>=1.14",
    "prek>=0.2",
    "pytest>=8.3",
    "ruff>=0.11",
    "twine>=6.1",
]
# Vaultwarden-backed credential resolution via Locke. Without this extra,
# secrets resolve from environment variables only — sufficient for CI where
# secrets come from the runner's variables, but local dev usually wants
# vault support so credentials don't have to be pasted into shells.
vault = [
    "locke @ git+https://gitlab.com/martin-wieser/locke.git#subdirectory=python",
]
# CDN and DNS providers
cdn = [
    "cloudflare==4.3.1",
    "hetzner-dns-api>=1.0.0",
]
# Data processing and export
data = [
    "beautifulsoup4~=4.13.4",
    "gspread>=6.2.1",
    "openpyxl==3.1.5",
    "pandas>=2.3.0",
    "pyairtable~=3.1.1",
    "pymongo>=4.13",
]
# AI/ML integrations
ml = [
    "anthropic>=0.54.0",
    "google-generativeai>=0.8.5",
    "langchain>=0.3.26",
    "langchain-openai>=0.3.24",
    "litellm>=1.73.0",
    "ollama>=0.5.1",
    "openai>=1.90.0",
    "tiktoken>=0.9.0",
]
# Browser automation
browser = [
    "playwright>=1.52.0",
    "selenium>=4.33.0",
    "webdriver-manager>=4.0.2",
]
# Full install (everything)
all = [
    "granny-devops[vault,cdn,data,ml,browser]",
    "azure-identity>=1.23.0",
    "boto3-stubs>=1.40",
    "certifi>=2025.6.15",
    "earthengine-api>=1.5.20",
    "elasticsearch>=8.0.0,<9.0.0",
    "elasticsearch-dsl>=8.0.0,<9.0.0",
    "flask>=3.1.1",
    "flask-cors>=6.0.1",
    "google-auth>=2.40.3",
    "ipython~=9.3.0",
    "json5>=0.12.0",
    "jsonschema>=4.0.0",
    "langdetect>=1.0.9",
    "matplotlib>=3.10.3",
    "msoffcrypto-tool>=5.4.2",
    "numpy>=2.3.1",
    "pdf2image>=1.17.0",
    "pillow>=11.2.1",
    "pydantic>=2.11.7",
    "pymilvus>=2.5.11",
    "pypdf>=5.6.1",
    "pytesseract>=0.3.13",
    "pyzbar>=0.1.9",
    "sentinelhub>=3.11.1",
    "sentry-sdk>=2.30.0",
    "zxing>=1.0.3",
]

[project.scripts]
granny = "granny.cli.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The optional [vault] extra uses a PEP 508 direct URL
# (`locke @ git+https://gitlab.com/...`). Hatchling refuses these by default.
[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["granny"]

[tool.hatch.build.targets.sdist]
include = ["granny"]
